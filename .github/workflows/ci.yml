name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Compile and test
        run: |
          python -m compileall -q app jobs dags tests
          python -m unittest discover -s tests -v
          python -c "from app.api import app; print(len(app.openapi()['paths']))"
      - name: Audit Python dependencies
        run: |
          python -m pip install pip-audit
          python -m pip_audit -r requirements-dev.txt
  compose-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Configure local demo secrets
        run: cp .env.example .env
      - name: Build and start local stack
        run: docker compose up --build -d
      - name: Wait for API readiness
        run: timeout 600 bash -c 'until curl -fsS http://127.0.0.1:8000/health; do sleep 5; done'
      - name: Verify isolation, search, replay and restart
        env:
          COMMERCE_INTEGRATION_URL: http://127.0.0.1:8000
          COMMERCE_REPLAY_TEST: '1'
          DEMO_ADMIN_PASSWORD: local-demo-password
        run: python -m unittest discover -s tests -p test_integration.py -v
      - name: Run Airflow reconciliation
        run: docker compose exec -T airflow airflow dags test daily_reconciliation 2026-10-24
      - name: Show service diagnostics on failure
        if: failure()
        run: |
          docker compose ps
          docker compose logs --no-color --tail=150 processor api airflow postgres kafka clickhouse elasticsearch
      - name: Stop stack
        if: always()
        run: docker compose down -v
