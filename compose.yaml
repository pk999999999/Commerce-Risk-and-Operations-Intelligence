name: commerce-intelligence
services:
  postgres:
    image: postgres:16.8-alpine
    environment:
      POSTGRES_DB: commerce
      POSTGRES_USER: commerce
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env and set POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/postgres.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U commerce -d commerce"]
      interval: 5s
      retries: 20
  kafka:
    image: apache/kafka:4.2.2
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
    volumes:
      - kafkadata:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      retries: 20
  kafka-init:
    image: apache/kafka:4.2.2
    depends_on:
      kafka:
        condition: service_healthy
    command: ["/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "kafka:9092", "--create", "--if-not-exists", "--topic", "commerce.events.v1", "--partitions", "3", "--replication-factor", "1"]
  clickhouse:
    image: clickhouse/clickhouse-server:25.3
    environment:
      CLICKHOUSE_DB: commerce
      CLICKHOUSE_USER: commerce
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?Set CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - chdata:/var/lib/clickhouse
      - ./sql/clickhouse.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user commerce --password \"$$CLICKHOUSE_PASSWORD\" --query 'SELECT 1' >/dev/null"]
      interval: 10s
      retries: 20
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.23
    environment:
      discovery.type: single-node
      xpack.security.enabled: 'false'
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    volumes:
      - esdata:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health >/dev/null"]
      interval: 10s
      retries: 30
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment: &app-env
      DATABASE_URL: postgresql://commerce:${POSTGRES_PASSWORD}@postgres:5432/commerce
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      ELASTICSEARCH_URL: http://elasticsearch:9200
      KAFKA_BOOTSTRAP: kafka:9092
      TOKEN_SECRET: ${TOKEN_SECRET:?Set TOKEN_SECRET}
      DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD:?Set DEMO_ADMIN_PASSWORD}
      APP_ENV: ${APP_ENV:-local}
    depends_on:
      postgres: {condition: service_healthy}
      clickhouse: {condition: service_healthy}
    ports:
      - '127.0.0.1:8000:8000'
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      retries: 20
  processor:
    build:
      context: .
      dockerfile: Dockerfile.spark
    environment: *app-env
    depends_on:
      postgres: {condition: service_healthy}
      kafka-init: {condition: service_completed_successfully}
      clickhouse: {condition: service_healthy}
      elasticsearch: {condition: service_healthy}
    volumes:
      - lake:/opt/project/lake
      - checkpoints:/opt/project/checkpoints
  generator:
    build:
      context: .
      dockerfile: Dockerfile.api
    command: ["python", "-m", "app.generator"]
    environment: *app-env
    depends_on:
      kafka-init: {condition: service_completed_successfully}
      api: {condition: service_healthy}
    restart: 'no'
  airflow:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    environment:
      <<: *app-env
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: 'false'
    depends_on:
      postgres: {condition: service_healthy}
      clickhouse: {condition: service_healthy}
      elasticsearch: {condition: service_healthy}
    volumes:
      - lake:/opt/project/lake:ro
      - airflowdata:/opt/airflow
      - ./dags:/opt/airflow/dags:ro
    ports:
      - '127.0.0.1:8080:8080'
  load-generator:
    profiles: [loadtest]
    build:
      context: .
      dockerfile: Dockerfile.api
    command: ["python", "-m", "app.generator", "--count", "100000"]
    environment: *app-env
    depends_on:
      kafka-init: {condition: service_completed_successfully}
    restart: 'no'
volumes:
  pgdata:
  kafkadata:
  chdata:
  esdata:
  lake:
  checkpoints:
  airflowdata:
